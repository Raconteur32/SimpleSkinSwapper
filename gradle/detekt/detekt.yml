# detekt rule ledger — rules are adopted wave by wave (change: adopt-detekt-incrementally).
# The CLI runs without classpath (no type resolution), so rules requiring type resolution
# are excluded. build-upon-default-config stays disabled: only rules listed here as
# `active: true` run, and the repository stays clean for every adopted rule (CI gate).
build:
  maxIssues: 0
config:
  validation: true

potential-bugs:
  active: true
  AvoidReferentialEquality:
    active: true
  DoubleMutabilityForCollection:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  EqualsWithHashCodeExist:
    active: true
  ExplicitGarbageCollectionCall:
    active: true
  IgnoredReturnValue:
    active: true
  ImplicitDefaultLocale:
    active: true
  InvalidRange:
    active: true
  IteratorHasNextCallsNextMethod:
    active: true
  IteratorNotThrowingNoSuchElementException:
    active: true
  MapGetWithNotNullAssertionOperator:
    active: true
  UnnecessaryNotNullCheck:
    active: true
  UnnecessaryNotNullOperator:
    active: true
  UnnecessarySafeCall:
    active: true
  UnreachableCatchBlock:
    active: true
  UnreachableCode:
    active: true
  UnsafeCallOnNullableType:
    active: true
  UnsafeCast:
    active: true
  UnusedUnaryOperator:
    active: true
  UselessPostfixExpression:
    active: true
  WrongEqualsTypeParameter:
    active: true

naming:
  active: true
  ClassNaming:
    active: true
  ConstructorParameterNaming:
    active: true
  EnumNaming:
    active: true
  FunctionNaming:
    active: true
    # IPlayerSkinUpdatable declares a mixin injection anchor whose `$` name is fixed by
    # the mixin target and cannot follow Kotlin conventions.
    excludes: ['**/IPlayerSkinUpdatable.kt']
  FunctionParameterNaming:
    active: true
  InvalidPackageDeclaration:
    active: true
  MatchingDeclarationName:
    active: true
  MemberNameEqualsClassName:
    active: true
  NoNameShadowing:
    active: true
  ObjectPropertyNaming:
    active: true
  PackageNaming:
    active: true
  TopLevelPropertyNaming:
    active: true
  VariableNaming:
    active: true

exceptions:
  active: true
  ExceptionRaisedInUnexpectedLocation:
    active: true
  InstanceOfCheckForException:
    active: true
  PrintStackTrace:
    active: true
  RethrowCaughtException:
    active: true
  ReturnFromFinally:
    active: true
  SwallowedException:
    active: true
  ThrowingExceptionFromFinally:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
  ThrowingNewInstanceOfSameException:
    active: true
  TooGenericExceptionCaught:
    active: true
  TooGenericExceptionThrown:
    active: true

style:
  active: true
  # Each rule below was verified to actually run without type resolution (probe-tested at
  # adoption). TR-only rules (VarCouldBeVal, MayBeConst-like nullability checks, UseOrEmpty,
  # UseIsNullOrEmpty, UseRequireNotNull, UselessCallOnNotNull, ObjectLiteralToLambda) are
  # deliberately absent: they silently no-op without a classpath, and a ledger entry that
  # never runs is false confidence. Revisit if detekt gains a typed run.
  UnusedPrivateMember:
    active: true
  UnusedPrivateProperty:
    active: true
  WildcardImport:
    active: true
  UseCheckOrError:
    active: true
  UseRequire:
    active: true
  UtilityClassWithPublicConstructor:
    active: true
  MayBeConst:
    active: true
  ModifierOrder:
    active: true
  EqualsNullCall:
    active: true
