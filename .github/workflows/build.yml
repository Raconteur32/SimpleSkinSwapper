name: Build all versions

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build every Minecraft version
        # The IDE only type-checks the active Stonecutter version; the root
        # `build` task compiles all version projects (1.21.11, 26.1.2, 26.2).
        run: ./gradlew build
